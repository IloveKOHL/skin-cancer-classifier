# Stronger recipe: larger backbone, higher resolution, more regularisation.
# Fits 8 GB VRAM with mixed precision. Merged over default.yaml.
#   python -m src.train --config configs/improved.yaml --override task.mode=multiclass

data:
  image_size: 384

model:
  name: convnext_tiny
  drop_rate: 0.0
  drop_path_rate: 0.1

train:
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.05
  label_smoothing: 0.1
  imbalance: weighted_sampler

augmentation:
  random_resized_crop_scale: [0.7, 1.0]
  rotation_degrees: 30
