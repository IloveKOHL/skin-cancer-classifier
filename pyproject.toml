[project]
name = "skin-cancer-classifier"
version = "0.1.0"
description = "Skin lesion classification on HAM10000 with PyTorch and timm (learning project, not a medical device)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
